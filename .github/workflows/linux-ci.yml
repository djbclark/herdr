name: Linux CI

# Overlay-only on ci/base. Port of .forgejo/workflows/ci.yml to ubuntu-latest.

on:
  push:
    branches: ['ci/run/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

jobs:
  linux:
    name: linux (lint, ci-tests, ghostty-vt scalar)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
      - name: Install Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          base=https://ziglang.org/download/0.16.0
          ok=0
          for name in zig-x86_64-linux-0.16.0.tar.xz zig-linux-x86_64-0.16.0.tar.xz; do
            if curl -fsSL -o /tmp/zig.tar.xz "$base/$name"; then ok=1; break; fi
          done
          [ "$ok" = 1 ]
          sudo mkdir -p /opt/zig && sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version
          echo "ZIG=/usr/local/bin/zig" >> "$GITHUB_ENV"
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Run Linux lint
        run: CARGO_INCREMENTAL=1 just lint
      - name: Run Linux tests
        run: CARGO_INCREMENTAL=1 just ci-tests 'all()'
      - name: Check scalar libghostty with runtime safety
        env:
          LIBGHOSTTY_VT_SIMD: "false"
          LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
        run: CARGO_INCREMENTAL=1 cargo nextest run --locked -E 'package(ghostty-vt) | test(ghostty)' --status-level fail --final-status-level fail --failure-output final --success-output never
