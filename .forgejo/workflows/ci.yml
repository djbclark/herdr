name: CI

# Linux leg of the check job in .github/workflows/ci.yml, run on SIPB Hyades
# (forgejo-ci skill). GitHub ignores this directory; the macOS leg
# (just ci 'not binary(live_handoff)') and the Windows legs stay on GitHub's
# runners.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep file/line backtraces without generating type and variable debug information.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

jobs:
  linux:
    name: linux (lint, ci-tests, ghostty-vt scalar)
    runs-on: ubuntu
    timeout-minutes: 40
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install gcc and Rust (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq gcc libc6-dev >/dev/null
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none >/dev/null
          . "$HOME/.cargo/env"
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust tools
        uses: https://github.com/taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25
        with:
          tool: just,cargo-nextest
      - name: Install Bun
        uses: https://github.com/oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install Zig
        uses: https://github.com/vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: 0.16.0
      # build.rs finds zig through ZIG or PATH; pin both.
      - name: Export ZIG for build.rs
        run: echo "ZIG=$(command -v zig)" >> "$GITHUB_ENV"
      - name: Cache cargo registry
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Run Linux lint
        run: CARGO_INCREMENTAL=1 just lint
      - name: Run Linux tests
        run: CARGO_INCREMENTAL=1 just ci-tests 'all()'
      - name: Check scalar libghostty with runtime safety
        env:
          LIBGHOSTTY_VT_SIMD: "false"
          LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
        run: CARGO_INCREMENTAL=1 cargo nextest run --locked -E 'package(ghostty-vt) | test(ghostty)' --status-level fail --final-status-level fail --failure-output final --success-output never
